<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#39E079",
                        "secondary": "#3B82F6",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-morphic {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-morphic {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #39E079 0%, #3B82F6 100%);
            box-shadow: 0 10px 25px -5px rgba(57, 224, 121, 0.4);
        }
        .floating-shield {
            filter: drop-shadow(0 20px 30px rgba(57, 224, 121, 0.3));
        }
    </style>
<style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0e1a13] dark:text-white transition-colors duration-300">
<header class="w-full px-6 pt-12 pb-6 flex justify-between items-center">
<button class="size-10 flex items-center justify-center rounded-full bg-white dark:bg-white/5 shadow-sm">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</button>
<div class="flex gap-1.5">
<div class="h-1.5 w-4 rounded-full bg-primary/20 dark:bg-white/10"></div>
<div class="h-1.5 w-4 rounded-full bg-primary/20 dark:bg-white/10"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
</div>
<div class="size-10"></div> 
</header>
<main class="flex-1 flex flex-col items-center justify-between px-8 py-10 max-w-md mx-auto w-full">
<div class="relative w-full aspect-square flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 dark:bg-primary/5 rounded-full blur-3xl scale-75"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] border-2 border-dashed border-primary/20 rounded-full"></div>
<div class="relative z-10 w-48 h-56 glass-morphic rounded-[2.5rem] flex items-center justify-center floating-shield shadow-2xl">
<div class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white shadow-xl">
<span class="material-symbols-outlined text-5xl fill-1">shield</span>
</div>
<div class="absolute -top-4 -right-4 size-14 rounded-2xl glass-morphic flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-2xl">fingerprint</span>
</div>
<div class="absolute bottom-10 -left-6 size-12 rounded-xl glass-morphic flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-secondary text-xl">key</span>
</div>
</div>
</div>
<div class="text-center w-full">
<h1 class="text-4xl font-extrabold tracking-tighter mb-4 leading-none">
                SECURE &amp;<br/>
<span class="text-primary">PRIVATE</span>
</h1>
<p class="text-base text-[#0e1a13]/60 dark:text-white/60 leading-relaxed max-w-[280px] mx-auto font-medium">
                Your data is encrypted and protected with bank-level security.
            </p>
</div>
<div class="w-full space-y-4">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">lock</span>
<span class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-50">AES-256 Encryption</span>
</div>
<button class="w-full gradient-btn text-white font-bold py-5 px-8 rounded-2xl flex items-center justify-center gap-3 transition-all active:scale-95 text-lg">
                Get Started
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
<p class="text-[11px] text-center opacity-40 font-medium">
                By tapping Get Started, you agree to our Terms of Service
            </p>
</div>
</main>
<div class="h-8 w-full"></div>

</body></html>
