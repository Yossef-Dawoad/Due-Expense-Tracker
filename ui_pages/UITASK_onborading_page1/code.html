<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#39E079",
                        "background-light": "#ffffff",
                        "accent-gold": "#FFD700",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .glow-button {
            box-shadow: 0 8px 25px -5px rgba(57, 224, 121, 0.5);
        }
        .floating-card {
            transform: perspective(1000px) rotateY(-15deg) rotateX(10deg);
            background: linear-gradient(135deg, #1e3a8a 0%, #581c87 100%);
        }
        .ambient-shadow-1 {
            background: radial-gradient(circle, rgba(57, 224, 121, 0.15) 0%, transparent 70%);
        }
        .ambient-shadow-2 {
            background: radial-gradient(circle, rgba(88, 28, 135, 0.1) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light text-[#0e1a13] h-screen flex flex-col justify-between">
<div class="fixed inset-0 pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] size-[80vw] ambient-shadow-1 blur-3xl"></div>
<div class="absolute top-[40%] -right-[20%] size-[90vw] ambient-shadow-2 blur-3xl"></div>
</div>
<main class="relative z-10 flex flex-col h-full px-8 pt-20 pb-12">
<div class="text-center mb-12">
<h1 class="text-[42px] leading-[1.1] font-[800] tracking-tighter text-[#0e1a13] uppercase">
                Master Your<br/>
<span class="text-primary">Money</span>
</h1>
</div>
<div class="flex-grow flex items-center justify-center relative">
<div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center">
<div class="absolute inset-0 glass-container rounded-[48px] rotate-6 scale-95 opacity-50"></div>
<div class="absolute inset-0 glass-container rounded-[48px]"></div>
<div class="relative z-10 w-full h-full flex items-center justify-center">
<div class="floating-card w-48 h-32 rounded-2xl shadow-2xl relative flex flex-col justify-between p-4 text-white overflow-hidden border border-white/20">
<div class="flex justify-between items-start">
<div class="size-8 bg-white/20 rounded-md"></div>
<span class="material-symbols-outlined text-white/50">contactless</span>
</div>
<div class="space-y-1">
<div class="h-1.5 w-24 bg-white/30 rounded"></div>
<div class="h-1.5 w-16 bg-white/20 rounded"></div>
</div>
<div class="absolute right-4 bottom-4 size-6 bg-white/10 rounded-full blur-sm"></div>
</div>
<div class="absolute top-1/2 -translate-y-1/2 -right-4 size-16 bg-gradient-to-br from-accent-gold to-[#D4AF37] rounded-full shadow-lg border-2 border-white/40 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl font-bold">attach_money</span>
</div>
<div class="absolute bottom-10 left-6 size-12 bg-gradient-to-br from-accent-gold to-[#B8860B] rounded-full shadow-lg border-2 border-white/40 flex items-center justify-center -rotate-12">
<span class="material-symbols-outlined text-white text-xl font-bold">payments</span>
</div>
<div class="absolute top-12 left-10 size-8 bg-gradient-to-br from-accent-gold to-[#DAA520] rounded-full shadow-lg border-2 border-white/40 opacity-80 rotate-45"></div>
</div>
</div>
</div>
<div class="mt-12 text-center space-y-10">
<p class="text-lg text-[#0e1a13]/70 font-medium px-4 leading-relaxed">
                Track your spending, set budgets, and grow your wealth with ease.
            </p>
<div class="flex flex-col items-center gap-8">
<div class="flex gap-2">
<div class="h-2 w-8 bg-primary rounded-full"></div>
<div class="h-2 w-2 bg-[#0e1a13]/10 rounded-full"></div>
<div class="h-2 w-2 bg-[#0e1a13]/10 rounded-full"></div>
</div>
<button class="w-full bg-primary text-[#0e1a13] font-extrabold text-lg py-5 rounded-[24px] glow-button flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                    Next
                    <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
</div>
</main>

</body></html>
