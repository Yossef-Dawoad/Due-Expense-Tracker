<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bank Connection Successful</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee75",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102217",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative mx-auto flex h-screen max-w-[430px] w-full flex-col bg-white dark:bg-background-dark overflow-hidden">
<!-- Top Status Bar (iOS style placeholder) -->
<div class="flex items-center justify-between px-8 pt-4 pb-2">
<span class="text-sm font-bold dark:text-white">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-sm dark:text-white">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-sm dark:text-white">wifi</span>
<span class="material-symbols-outlined text-sm dark:text-white">battery_full</span>
</div>
</div>
<!-- Main Content Area -->
<div class="flex w-full grow flex-col items-center justify-center p-6">
<!-- Hero Illustration Container -->
<div class="relative w-full aspect-square flex items-center justify-center mb-8">
<!-- Abstract confetti/gradient background -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/10 via-transparent to-primary/5 blur-3xl"></div>
<div class="relative z-10 w-64 h-64 bg-white dark:bg-zinc-900 rounded-full shadow-2xl shadow-primary/20 flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-transparent opacity-50"></div>
<div class="flex flex-col items-center">
<div class="w-32 h-32 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/40">
<span class="material-symbols-outlined text-white text-[80px] font-bold">check</span>
</div>
</div>
<!-- Decorative Floating Elements -->
<div class="absolute top-10 right-10 w-4 h-4 rounded-full bg-blue-300/40"></div>
<div class="absolute bottom-12 left-8 w-6 h-6 rounded-lg rotate-45 bg-pink-300/40"></div>
<div class="absolute top-20 left-12 w-3 h-3 rounded-full bg-yellow-300/40"></div>
</div>
<!-- Confetti particles represented by divs -->
<div class="absolute top-0 left-1/4 w-2 h-2 bg-primary rounded-full"></div>
<div class="absolute top-10 right-1/4 w-3 h-3 bg-blue-400 rounded-full"></div>
<div class="absolute bottom-20 right-10 w-2 h-4 bg-yellow-400 rounded-full rotate-12"></div>
</div>
<!-- Typography -->
<h1 class="text-[#111814] dark:text-white tracking-tight text-[36px] font-extrabold leading-tight text-center mb-2">SUCCESS!</h1>
<p class="text-zinc-500 dark:text-zinc-400 text-lg font-medium leading-relaxed text-center px-6 mb-10">
                Your Chase Bank account is now linked.
            </p>
<!-- Account Summary Card -->
<div class="w-full bg-white dark:bg-zinc-900 border border-zinc-100 dark:border-zinc-800 rounded-2xl p-5 mb-8 flex items-center gap-4 shadow-sm">
<div class="w-14 h-14 bg-[#111814] rounded-xl flex items-center justify-center text-white shrink-0">
<span class="material-symbols-outlined text-3xl">account_balance</span>
</div>
<div class="flex flex-col grow">
<div class="flex justify-between items-center">
<p class="text-[#111814] dark:text-white text-base font-bold">Chase Savings</p>
<p class="text-[#111814] dark:text-white text-base font-bold">$12,450.00</p>
</div>
<p class="text-zinc-400 text-sm font-normal">**** 1234</p>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 pb-12 w-full">
<button class="w-full h-16 bg-gradient-to-r from-primary to-[#24d166] text-zinc-900 text-lg font-bold rounded-2xl shadow-xl shadow-primary/20 flex items-center justify-center transition-transform active:scale-[0.98]">
                Go to Dashboard
            </button>
<div class="h-1.5 w-32 bg-zinc-200 dark:bg-zinc-700 rounded-full mx-auto mt-8"></div>
</div>
</div>
</body></html>
