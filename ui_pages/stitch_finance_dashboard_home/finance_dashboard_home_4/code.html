<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#39E079",
                        "accent": "#8B5CF6",
                        "background-light": "#FFFFFF",
                        "background-dark": "#122017",
                        "surface-light": "#F3F4F6",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Manrope', sans-serif;
                -webkit-tap-highlight-color: transparent;
                min-height: 100dvh;
                @apply bg-white text-slate-900 overflow-x-hidden;
            }
        }
        @layer components {
            .glass-safe {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.5);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            }
            .glow-primary {
                box-shadow: 0 10px 30px -5px rgba(57, 224, 121, 0.5);
            }
            .nav-glass {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
            .glass-illustration-bg {
                background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            }
            .safe-handle {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.2) 100%);
            }
            .floating-card {
                background: rgba(255, 255, 255, 0.45);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.6);
            }
        }
    </style>
<style>
        body {
            min-height: max(844px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-sm px-4 pt-12 pb-2">
<div class="flex items-center justify-between max-w-md mx-auto">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-base font-bold tracking-tight">Wallet Details</h2>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-2xl">more_horiz</span>
</button>
</div>
</header>
<main class="pt-24 px-6 max-w-md mx-auto flex flex-col flex-grow items-center">
<div class="text-center py-6 w-full">
<p class="text-slate-400 font-bold mb-1 tracking-[0.15em] uppercase text-[10px]">Total Balance</p>
<h1 class="text-5xl font-extrabold tracking-tight text-slate-900">$0.00</h1>
</div>
<div class="flex-grow flex flex-col items-center justify-center py-8 relative w-full overflow-visible">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-primary/10 rounded-full blur-[80px] -z-10"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-accent/10 rounded-full blur-[60px] -z-10"></div>
<div class="relative w-72 h-72 flex items-center justify-center glass-illustration-bg rounded-full">
<div class="relative w-44 h-48 glass-safe rounded-[2.5rem] flex items-center justify-center overflow-hidden rotate-[8deg]">
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-white/60 to-transparent"></div>
<div class="absolute -top-[20%] -left-[20%] w-[150%] h-[150%] bg-gradient-to-br from-white/30 via-transparent to-white/5 rotate-45"></div>
<div class="relative z-10 size-20 rounded-full safe-handle border border-white/60 flex items-center justify-center shadow-lg">
<div class="size-14 rounded-full border-4 border-white/40 flex items-center justify-center">
<div class="size-2.5 bg-white/80 rounded-full"></div>
</div>
<div class="absolute top-2 w-1 h-2 bg-white/60 rounded-full"></div>
<div class="absolute bottom-2 w-1 h-2 bg-white/60 rounded-full"></div>
<div class="absolute left-2 h-1 w-2 bg-white/60 rounded-full"></div>
<div class="absolute right-2 h-1 w-2 bg-white/60 rounded-full"></div>
</div>
<div class="absolute right-4 top-1/4 bottom-1/4 w-3 bg-white/20 rounded-full border border-white/30 shadow-inner"></div>
</div>
<div class="absolute -top-4 right-6 size-14 floating-card rounded-2xl flex items-center justify-center -rotate-12 shadow-xl">
<span class="material-symbols-outlined text-accent text-3xl fill-1">account_balance_wallet</span>
</div>
<div class="absolute bottom-6 -left-4 size-16 floating-card rounded-3xl flex items-center justify-center rotate-6 shadow-xl">
<span class="material-symbols-outlined text-primary text-4xl font-bold">add</span>
</div>
<div class="absolute top-4 left-4 size-10 floating-card rounded-full flex items-center justify-center blur-[0.5px]">
<span class="material-symbols-outlined text-slate-400 text-xl">savings</span>
</div>
<div class="absolute -bottom-2 right-12 size-12 floating-card rounded-full flex items-center justify-center -rotate-6 shadow-md">
<span class="material-symbols-outlined text-emerald-400 text-2xl">trending_up</span>
</div>
</div>
<div class="text-center px-6 mt-12 w-full max-w-[340px]">
<h3 class="text-[26px] font-extrabold text-slate-900 mb-3 leading-tight">
                    Your Financial Journey Starts Here
                </h3>
<p class="text-slate-500 text-[15px] font-medium leading-relaxed mb-10 px-2">
                    Connect your accounts or add your first transaction to see your wealth grow.
                </p>
<button class="w-full bg-gradient-to-r from-primary to-emerald-500 text-white font-extrabold py-5 px-8 rounded-2xl glow-primary active:scale-95 transition-all flex items-center justify-center gap-3 mx-auto shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-2xl">link</span>
                    Connect First Account
                </button>
</div>
</div>
<div class="h-32"></div>
</main>
<nav class="fixed bottom-0 left-0 right-0 z-50 nav-glass border-t border-slate-100 px-8 pb-10 pt-4">
<div class="flex items-center justify-between relative max-w-md mx-auto">
<button class="flex flex-col items-center gap-1 opacity-30">
<span class="material-symbols-outlined text-2xl">home</span>
</button>
<button class="flex flex-col items-center gap-1 opacity-30">
<span class="material-symbols-outlined text-2xl">pie_chart</span>
</button>
<div class="absolute -top-14 left-1/2 -translate-x-1/2">
<button class="size-16 rounded-full bg-primary flex items-center justify-center text-white glow-primary shadow-xl hover:scale-105 active:scale-90 transition-all">
<span class="material-symbols-outlined text-3xl font-bold">add</span>
</button>
</div>
<div class="w-12"></div> 
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined text-2xl fill-1 font-bold">account_balance_wallet</span>
</button>
<button class="flex flex-col items-center gap-1 opacity-30">
<span class="material-symbols-outlined text-2xl">person</span>
</button>
</div>
</nav>

</body></html>
