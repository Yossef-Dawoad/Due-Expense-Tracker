<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#39E079",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glow-chart-bar {
            box-shadow: 0 0 20px rgba(57, 224, 121, 0.4);
        }
        .illustration-blob {
            background: linear-gradient(135deg, rgba(57, 224, 121, 0.15) 0%, rgba(88, 28, 135, 0.1) 100%);
        }
        .bar-gradient {
            background: linear-gradient(to top, #39E079, #5eead4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0e1a13] dark:text-white transition-colors duration-300 min-h-screen flex flex-col">
<main class="flex-1 flex flex-col items-center justify-between px-8 py-16 max-w-md mx-auto w-full">
<div class="w-full text-center mt-8">
<h1 class="text-4xl font-extrabold tracking-tighter text-[#0e1a13] dark:text-white mb-2">
            INSIGHTFUL <br/> ANALYTICS
        </h1>
</div>
<div class="relative w-full flex items-center justify-center py-12">
<div class="absolute size-64 illustration-blob rounded-full blur-3xl"></div>
<div class="absolute size-48 bg-primary/5 rounded-full -top-10 -right-10 blur-2xl"></div>
<div class="relative z-10 w-full aspect-square max-w-[280px] glass-card rounded-[2.5rem] p-6 shadow-2xl flex flex-col justify-between overflow-hidden">
<div class="flex justify-between items-center mb-4">
<div class="size-8 rounded-lg bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm">trending_up</span>
</div>
<div class="h-1.5 w-12 bg-white/20 rounded-full"></div>
</div>
<div class="flex items-end justify-between gap-3 flex-1 px-2 pt-4">
<div class="w-full bg-white/10 rounded-t-lg h-[40%]"></div>
<div class="w-full bg-white/10 rounded-t-lg h-[60%]"></div>
<div class="w-full bar-gradient rounded-t-lg h-[85%] glow-chart-bar"></div>
<div class="w-full bg-white/10 rounded-t-lg h-[50%]"></div>
<div class="w-full bg-white/10 rounded-t-lg h-[70%]"></div>
</div>
<div class="mt-6 flex gap-4">
<div class="h-3 w-16 bg-white/10 rounded-full"></div>
<div class="h-3 w-8 bg-white/10 rounded-full"></div>
</div>
</div>
<div class="absolute top-1/4 -right-4 z-20 glass-card px-4 py-2 rounded-2xl shadow-lg border-white/20">
<p class="text-[10px] font-bold text-primary uppercase tracking-widest">+24%</p>
</div>
<div class="absolute bottom-1/4 -left-4 z-20 glass-card px-4 py-2 rounded-2xl shadow-lg border-white/20">
<p class="text-[10px] font-bold text-white/60 uppercase tracking-widest">Growth</p>
</div>
</div>
<div class="w-full flex flex-col items-center">
<div class="text-center px-4 mb-12">
<p class="text-lg text-[#0e1a13]/70 dark:text-white/70 leading-relaxed font-medium">
                Get clear visual reports of your financial habits and spending trends.
            </p>
</div>
<div class="flex gap-2 mb-10">
<div class="size-2 rounded-full bg-black/10 dark:bg-white/10"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="size-2 rounded-full bg-black/10 dark:bg-white/10"></div>
</div>
<button class="w-full bg-primary text-[#0e1a13] font-extrabold py-5 px-8 rounded-2xl shadow-[0_12px_24px_-8px_rgba(57,224,121,0.5)] flex items-center justify-center gap-2 hover:opacity-90 transition-all active:scale-[0.98]">
            Next
            <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
</main>

</body></html>
